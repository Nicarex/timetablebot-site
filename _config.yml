title: Timetable Bot
remote_theme: pmarsceill/just-the-docs

# enable plugin to expose Git last-modified info (used by just-the-docs footer)
plugins:
  - jekyll-last-modified-at

search_enabled: true

heading_anchors: true

# show "last edited" timestamp in the footer (absolute format)
last_edit_timestamp: true
last_edit_time_format: "%Y-%m-%d %H:%M"

aux_links:
  "Академия гражданской защиты МЧС России":
    - "https://amchs.ru"
  "Сообщество Timetable Bot":
    - "https://vk.com/bot_agz"

back_to_top: true
back_to_top_text: "Вернуться наверх"

color_scheme: nil
