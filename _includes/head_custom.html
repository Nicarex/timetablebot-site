<!-- Head custom: apply theme according to system preference -->
<link rel="stylesheet" href="/timetablebot-site/assets/css/just-the-docs-custom.css">
<script>
(function(){
  function applySystemTheme(){
    try{
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = prefersDark ? 'dark' : 'default';
      var link = document.querySelector('link[rel="stylesheet"]');
      if (link){
        var href = link.getAttribute('href');
        var newHref = href.replace(/just-the-docs-(default|light|dark)\.css$/, 'just-the-docs-' + (theme === 'dark' ? 'dark' : 'default') + '.css');
        if (newHref !== href) link.setAttribute('href', newHref);
      }
      try{ document.documentElement.setAttribute('data-color-scheme', prefersDark ? 'dark' : 'light'); } catch(e){}
    }catch(e){}
  }
  applySystemTheme();
  try{
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySystemTheme);
    }
  } catch(e){}
})();
</script>
